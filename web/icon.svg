<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">CineQueue icon</title>
  <desc id="desc">A dark rounded square with an amber projector-aperture mark over queue lines.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17141c"/>
      <stop offset="0.55" stop-color="#0b0b10"/>
      <stop offset="1" stop-color="#12100a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5d070"/>
      <stop offset="0.55" stop-color="#e2b13c"/>
      <stop offset="1" stop-color="#a87b1e"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.89 0 0 0 0 0.69 0 0 0 0 0.24 0 0 0 .45 0" result="color"/>
      <feMerge><feMergeNode in="color"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <circle cx="150" cy="118" r="150" fill="#e2b13c" opacity="0.1"/>
  <circle cx="392" cy="400" r="130" fill="#34d399" opacity="0.07"/>
  <g filter="url(#glow)">
    <rect x="118" y="128" width="276" height="200" rx="28" fill="none" stroke="url(#accent)" stroke-width="22"/>
    <path d="M118 186h276M118 244h276" stroke="url(#accent)" stroke-width="16" opacity="0.55"/>
    <path d="M200 128v200M312 128v200" stroke="url(#accent)" stroke-width="16" opacity="0.55"/>
    <path d="M150 360h128M150 398h84" stroke="url(#accent)" stroke-width="22" stroke-linecap="round"/>
  </g>
  <text x="342" y="412" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="72" font-weight="800" letter-spacing="-2" fill="#f4f4f7">CQ</text>
</svg>
