name: Publish Thales-tested images
# No builds run on GitHub: load the exact archives built and tested on Thales.
on:
  workflow_dispatch:
    inputs:
      release:
        description: Private prerelease containing the two verified image archives
        required: true
      revision:
        description: Exact GitHub source SHA built on Thales
        required: true
permissions:
  contents: read
  packages: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Download private, already-built image archives
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: ${{ inputs.release }}
        run: gh release download "$RELEASE" --repo "$GITHUB_REPOSITORY" --pattern 'movies-*.tar.gz' --pattern 'SHA256SUMS' --dir images
      - name: Verify and load exact archives (not a build)
        run: |
          cd images
          sha256sum --check SHA256SUMS
          for f in movies-*.tar.gz; do docker load < "$f"; done
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish architecture-specific images and manifest
        env:
          REVISION: ${{ inputs.revision }}
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            image="ghcr.io/humanitylabs-org/cinequeue:0.2.1-$arch"
            test "$(docker image inspect "$image" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')" = "$REVISION"
            docker push "$image"
          done
          docker buildx imagetools create -t ghcr.io/humanitylabs-org/cinequeue:0.2.1 ghcr.io/humanitylabs-org/cinequeue:0.2.1-amd64 ghcr.io/humanitylabs-org/cinequeue:0.2.1-arm64
          docker buildx imagetools inspect ghcr.io/humanitylabs-org/cinequeue:0.2.1
